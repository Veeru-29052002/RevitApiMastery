services:
  web:
    image: revitapimastery:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revitapimastery_app
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080:8080"
    restart: unless-stopped
